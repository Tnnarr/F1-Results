name: Post F1 results

# Started every few minutes by cron-job.org (and by the Run workflow button).
# GitHub's own schedule is not used, because it skips runs and caused overlaps.
on:
  workflow_dispatch:
    inputs:
      force_repost:
        description: "Repost the latest race even if it was already posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-results
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_STEWARDS: ${{ secrets.DISCORD_WEBHOOK_STEWARDS }}
      DISCORD_WEBHOOK_TECHNICAL: ${{ secrets.DISCORD_WEBHOOK_TECHNICAL }}
      DISCORD_WEBHOOK_REMINDERS: ${{ secrets.DISCORD_WEBHOOK_REMINDERS }}
      FORCE_REPOST: ${{ inputs.force_repost || 'false' }}
    steps:
      # Always start from the newest version of the repo, so the list of
      # already-posted items is up to date (prevents double posts).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests pymupdf

      - name: Session reminders
        if: always()
        run: python reminders.py

      - name: Post results card
        if: always()
        run: python f1_results.py

      - name: Post FIA documents
        if: always()
        run: python fia_classification.py

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Update posted items"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          echo "Couldn't save after 3 tries"
          exit 1
