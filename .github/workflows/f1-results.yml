name: Post F1 results

on:
  schedule:
    - cron: "*/15 * * * 0,6"   # every 15 min on Saturdays and Sundays (UTC)
  workflow_dispatch:            # adds a "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: f1-results
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for new results
        run: python f1_results.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save which races were posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted races" && git push)
